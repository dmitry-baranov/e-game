services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: diploma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diploma"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/diploma
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      STRATEGY_PREDICTOR_URL: http://ml:8090
      STRATEGY_LLM_URL: ${STRATEGY_LLM_URL:-}
      STRATEGY_LLM_MODEL: ${STRATEGY_LLM_MODEL:-}
      STRATEGY_LLM_KEY: ${STRATEGY_LLM_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    environment:
      STRATEGY_DATABASE_URL: postgresql://postgres:postgres@db:5432/diploma
    volumes:
      - strategy_models:/app/artifacts
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  strategy_models:
