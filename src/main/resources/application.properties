# database properties
spring.datasource.url=jdbc:postgresql://localhost:5435/diploma
spring.datasource.password=postgres
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=2
spring.threads.virtual.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.http.converters.preferred-json-mapper=jackson2
spring.session.store-type=jdbc
spring.mvc.message-codes-resolver-format=postfix_error_code

server.port=80
spring.main.allow-bean-definition-overriding=true
strategy.predictor.url=${STRATEGY_PREDICTOR_URL:}
strategy.llm.url=${STRATEGY_LLM_URL:}
strategy.llm.model=${STRATEGY_LLM_MODEL:}
strategy.llm.key=${STRATEGY_LLM_KEY:}
strategy.llm.provider=${STRATEGY_LLM_PROVIDER:openai}
# RestTemplate DEBUG traces request bodies, including private recommendation text.
logging.level.org.springframework.web.client.RestTemplate=INFO
logging.level.ru.itis.diploma.service.BuyerService=WARN
