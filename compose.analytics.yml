# Optional Grafana for the isolated experimental deployment only.
# First create a SELECT-only database role as documented in README.md.
services:
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GRAFANA_DB_READ_PASSWORD: ${GRAFANA_DB_READ_PASSWORD:?Set GRAFANA_DB_READ_PASSWORD}
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      experiment-db:
        condition: service_healthy
volumes:
  grafana_data:
